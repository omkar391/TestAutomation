[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -vs
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --reruns=2
    --reruns-delay=1
    --alluredir=reports/allure-results
    --html=reports/report.html
    --self-contained-html
    --capture=no

markers =
    smoke: Critical path smoke tests for sanity verification
    regression: Comprehensive regression test suite
    auth: Authentication, signup, and account management tests
    products: Product catalog, search, and details tests
    cart: Shopping cart and checkout tests
    flaky: Tests susceptible to intermittent network or site latency

# Logging settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

